plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = "AnkiNBT-Fabric-mc${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.parchmentmc.org' }
}

loom {
    runs {
        client {
            client()
            runDir 'run/client'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

task copySharedSources(type: Copy) {
    from('../../src/main/java') {
        exclude 'com/ankinbt/AnkiNBT.java'
        exclude 'com/ankinbt/keybind/**'
        exclude 'com/ankinbt/compat/**'
    }
    into 'build/shared-src/java'
}

task copySharedResources(type: Copy) {
    from('../../src/main/resources') {
        exclude 'META-INF/**'
        exclude 'pack.mcmeta'
    }
    into 'build/shared-resources'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'build/shared-src/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'build/shared-resources'
        }
    }
}

compileJava.dependsOn copySharedSources
processResources.dependsOn copySharedResources

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand 'version': project.mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

clean.doFirst {
    delete 'build/shared-src'
    delete 'build/shared-resources'
}
